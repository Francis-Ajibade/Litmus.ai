[project]
name = "coderace"
version = "0.0.1"
description = "CodeRace — a verification layer that races LLMs and only shows code that provably passes."
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi[standard]>=0.139.2",
    "openai>=2.45.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false
